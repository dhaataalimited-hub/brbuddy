# Publishes the website in site/ to GitHub Pages. Needs Pages turned on once with "Source: GitHub Actions"
# (see site/README.md). Runs when site/ changes on main, after each release (so the version badge is current), or by
# hand. The badge's version is stamped in at deploy time from the latest GitHub release.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Stamp the latest release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "Latest release: $tag"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "Unexpected tag '$tag'"; exit 1; }
          sed -i "s|<b data-version>[^<]*</b>|<b data-version>$tag</b>|" site/index.html
          grep -q "<b data-version>$tag</b>" site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
